name: Daily Contribution Keeping

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # <-- This is what fixes exit code 128!
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Activity Log
        run: |
          echo "Last active check: $(date)" > activity.log

      - name: Commit and Push
        run: |
          git config --global user.name 'SaiVarunPappla'
          git config --global user.email 'saivarunpappla@gmail.com'
          git add activity.log
          git commit -m "chore: automated daily activity update" || exit 0
          git push
